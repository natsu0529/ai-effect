<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Effect</title>
  <meta name="description" content="Wayback Machine の過去ページから、サイトの文章がいつからどれだけ AI っぽくなったかを時系列で可視化します。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>AI Effect</h1>
      <p class="lead">サイトの文章が、いつからどれだけ AI っぽくなったかを Wayback Machine の過去ページで調べます。</p>
    </header>

    <form id="form">
      <label class="url">
        <span>サイトまたはブログの URL</span>
        <input name="url" type="text" required placeholder="example.com/blog/" autocomplete="url">
      </label>
      <button type="submit">調べる</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>
    <progress id="progress" hidden></progress>

    <section id="result" hidden>
      <h2>推定AI度の推移</h2>
      <div class="chart-wrap">
        <div id="chart"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <p class="legend">
        <span class="item"><span class="key key-line"></span>半年ごとの平均</span>
        <span class="item"><span class="key key-dot"></span>各記事（クリックで Wayback の過去ページを開く）</span>
        <span class="item"><span class="key key-zero"></span>ChatGPT 公開前の平均</span>
      </p>
      <div id="note" class="note"></div>

      <h2>期間ごとの値</h2>
      <div class="table-wrap"><table id="period-table"></table></div>

      <h2>判定した記事</h2>
      <div class="table-wrap"><table id="article-table"></table></div>
    </section>

    <footer>
      <p>推定AI度は、ChatGPT 公開前の人間の記事と、同じ題で LLM に書かせた記事から学習した文体のモデルが出す確率です。個々の記事が AI で書かれたと断定するものではありません。</p>
    </footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
